apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-llama
    namespace: ollama-phase5
    labels:
        app: ollama
        model: llama3.2__1b
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: ollama
            model: llama3.2__1b
    template:
        metadata:
            labels:
                app: ollama
                model: llama3.2__1b
        spec:
            containers:
                - name: ollama
                  image: ollama/ollama:latest
                  ports:
                      - containerPort: 11434
                  env:
                      - name: OLLAMA_MODELS
                        value: /models
                  volumeMounts:
                      - name: models
                        mountPath: /models
                  resources:
                      requests:
                          cpu: "1"
                          memory: "3Gi"
                      limits:
                          cpu: "3"
                          memory: "6Gi"
                  readinessProbe:
                      exec:
                          command:
                              - /bin/sh
                              - -c
                              - ollama list | grep -F -q 'llama3.2:1b'
                      # httpGet:
                      #     path: /api/tags
                      #     port: 11434
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  startupProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
            volumes:
                - name: models
                  persistentVolumeClaim:
                      claimName: ollama-models
