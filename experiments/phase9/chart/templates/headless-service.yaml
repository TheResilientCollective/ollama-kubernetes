{{- if ne .Values.tier "infrastructure" -}}
apiVersion: v1
kind: Service
metadata:
    name: ollama-{{ .Release.Name }}-headless
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama
        tier: {{ .Values.tier }}
spec:
    clusterIP: None
    selector:
        app: ollama
        tier: {{ .Values.tier }}
    ports:
        - port: 11434
          targetPort: 11434
          name: http
{{- end }}
