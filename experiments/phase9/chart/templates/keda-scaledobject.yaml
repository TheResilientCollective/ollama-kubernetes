{{- if and (ne .Values.tier "router") .Values.keda.enabled }}
{{- $tierConfig := index .Values.tiers .Values.tier -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
    name: ollama-{{ .Release.Name }}-{{ .Values.tier }}-scaler
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama
        tier: {{ .Values.tier }}
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ollama-{{ .Release.Name }}
    pollingInterval: {{ $tierConfig.keda.pollingInterval | default .Values.keda.pollingInterval | default 5 }}
    cooldownPeriod: {{ $tierConfig.keda.cooldownPeriod | default .Values.keda.cooldownPeriod | default 60 }}
    minReplicaCount: {{ $tierConfig.keda.minReplicaCount | default .Values.keda.minReplicaCount | default 1 }}
    maxReplicaCount: {{ $tierConfig.keda.maxReplicaCount | default .Values.keda.maxReplicaCount | default 3 }}
    triggers:
        - type: prometheus
          metadata:
            serverAddress: http://{{ .Values.monitoring.prometheus.host | trimPrefix "http://" }}:{{ .Values.monitoring.prometheus.port }}
            metricName: ollama_gateway_queue_length # TODO: should probably publish a new metric that is the number of free pods
            query: sum(ollama_gateway_queue_length{tier="{{ .Values.tier }}"}) # TODO: target number of pods should be (queue_length + 1)
            threshold: "{{ .Values.keda.threshold | default 1 }}"
            activationThreshold: "{{ .Values.keda.activationThreshold | default 0 }}"
{{- end }}
