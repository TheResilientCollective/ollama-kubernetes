{{- if eq .Values.tier "router" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-router
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama-router
spec:
    replicas: {{ .Values.router.replicaCount }}
    selector:
        matchLabels:
            app: ollama-router
    template:
        metadata:
            labels:
                app: ollama-router
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "11434"
                prometheus.io/path: "/metrics"
        spec:
            containers:
                - name: router
                  image: {{ .Values.router.image }}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 11434
                  resources:
                      requests:
                          cpu: {{ .Values.router.resources.requests.cpu }}
                          memory: {{ .Values.router.resources.requests.memory }}
                      limits:
                          cpu: {{ .Values.router.resources.limits.cpu }}
                          memory: {{ .Values.router.resources.limits.memory }}
                  envFrom:
                      - configMapRef:
                          name: ollama-router-config
                  readinessProbe:
                      httpGet:
                          path: /api/tags
                          port: 11434
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /api/gateway/status
                          port: 11434
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 2
                      failureThreshold: 3
{{- end }}
