apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: nginx-stateful
spec:
    serviceName: nginx-stateful
    replicas: 3
    selector:
        matchLabels:
            app: nginx-stateful
    template:
        metadata:
            labels:
                app: nginx-stateful
        spec:
            containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                      - containerPort: 80
                  volumeMounts:
                      - name: persistent-storage
                        mountPath: /persistent-storage
    volumeClaimTemplates:
        - metadata:
              name: persistent-storage
          spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                  requests:
                      storage: 1Gi
