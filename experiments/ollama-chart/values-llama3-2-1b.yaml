image:
  repository: ollama/ollama
  tag: "latest"
  pullPolicy: IfNotPresent

model:
  name: "llama3.2:1b"

replicaCount: 3

service:
  type: ClusterIP
  port: 11434

resources:
  requests:
    cpu: "2"
    memory: "3Gi"
  limits:
    cpu: "3"
    memory: "4Gi"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 18Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: false

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 30

readinessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilization: 50
