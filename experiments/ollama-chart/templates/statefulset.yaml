apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      initContainers:
        - name: model-loader
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting Ollama Server..."
              ollama serve & SERVER_PID=$!
              echo "Waiting for Ollama Server to start..."
              sleep 5

              echo "Downloading model {{ .Values.model.name }}"
              ollama pull {{ .Values.model.name }}
              hasModel=$(ollama list | grep {{ .Values.model.name }} | wc -l)
              if [ $hasModel -eq 0 ]; then
                  echo "Model {{ .Values.model.name }} not found"
                  kill $SERVER_PID
                  exit 1
              else
                  echo "Model {{ .Values.model.name }} downloaded successfully"
                  kill $SERVER_PID
                  exit 0
              fi
          volumeMounts:
            - name: ollama-config
              mountPath: /home/ubuntu/.ollama

      containers:
        - name: ollama
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          volumeMounts:
            - name: ollama-config
              mountPath: /home/ubuntu/.ollama

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"

  volumeClaimTemplates:
    - metadata:
        name: ollama-config
      spec:
        accessModes: [ "{{ .Values.persistence.accessMode }}" ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
