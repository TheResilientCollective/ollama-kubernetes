apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama
    namespace: ollama-phase1
    labels:
        app: ollama
        model: qwen2.5-coder__3b
spec:
    replicas: 3
    selector:
        matchLabels:
            app: ollama
            model: qwen2.5-coder__3b
    template:
        metadata:
            labels:
                app: ollama
                model: qwen2.5-coder__3b
        spec:
            containers:
                - name: ollama
                  image: ollama/ollama:latest
                  ports:
                      - containerPort: 11434
                  env:
                      - name: OLLAMA_MODELS
                        value: /models
                  volumeMounts:
                      - name: models
                        mountPath: /models
            volumes:
                - name: models
                  emptyDir: {}
