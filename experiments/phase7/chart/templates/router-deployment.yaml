{{- if eq .Values.tier "router" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-router
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama-router
spec:
    replicas: {{ .Values.router.replicaCount }}
    selector:
        matchLabels:
            app: ollama-router
    template:
        metadata:
            labels:
                app: ollama-router
        spec:
            containers:
                - name: router
                  image: {{ .Values.router.image }}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 11434
                  resources:
                      requests:
                          cpu: {{ .Values.router.resources.requests.cpu }}
                          memory: {{ .Values.router.resources.requests.memory }}
                      limits:
                          cpu: {{ .Values.router.resources.limits.cpu }}
                          memory: {{ .Values.router.resources.limits.memory }}
                  envFrom:
                      - configMapRef:
                          name: ollama-router-config

{{- end }}
