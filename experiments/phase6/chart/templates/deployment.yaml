apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-{{ .Release.Name }}
    namespace: "{{ .Release.Namespace }}"
    labels:
        app: ollama
        tier: "{{ .Values.tier }}"
spec:
    replicas: {{ .Values.replicaCount }}
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: ollama
            tier: "{{ .Values.tier }}"
    template:
        metadata:
            labels:
                app: ollama
                tier: "{{ .Values.tier }}"
        spec:
            containers:
                - name: ollama
                  image: ollama/ollama:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 11434
                  env:
                      - name: OLLAMA_MODELS
                        value: /models
                      - name: SIZE_CLASS
                        value: "{{ .Values.tier }}"
                  envFrom:
                      - configMapRef:
                            name: ollama-config
                  volumeMounts:
                      - name: models
                        mountPath: /models
                  resources:
                      requests:
                          cpu: "{{ .Values.resources.requests.cpu }}"
                          memory: "{{ .Values.resources.requests.memory }}"
                      limits:
                          cpu: "{{ .Values.resources.limits.cpu }}"
                          memory: "{{ .Values.resources.limits.memory }}"
                  readinessProbe:
                      exec:
                          command:
                              - /bin/sh
                              - -c
                              - |
                                  [ "$(ollama list | wc -l)" -gt 1 ]
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  startupProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
            volumes:
                - name: models
                  persistentVolumeClaim:
                      claimName: ollama-models
