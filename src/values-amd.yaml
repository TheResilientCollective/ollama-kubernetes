gpu:
    enabled: true
    vendor: "amd"
    count: 1
    ollamaImage: ollama/ollama:rocm
    tolerations:
        key: "amd.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

ollama:
    volumes:
        kfd:
            name: dev-kfd
            hostPath:
                path: /dev/kfd
        dri:
            name: dev-dri
            hostPath:
                path: /dev/dri
    volumeMounts:
        kfd:
            name: dev-kfd
            mountPath: /dev/kfd
        dri:
            name: dev-dri
            mountPath: /dev/dri
