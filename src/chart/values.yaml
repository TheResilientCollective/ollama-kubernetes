# Sizing Tiers
tier: "" # Overridden by values-small|medium|large.yaml
tiers:
    small:
        resources:
            requests:
                cpu: 1
                memory: 800Mi
            limits:
                cpu: 3
                memory: 2Gi
        replicaCount: 1
        autoscaling:
            enabled: false
            # minReplicas: 1
            # maxReplicas: 3
            # targetCPUUtilization: 60
        keda:
            enabled: true
            minReplicaCount: 1
            maxReplicaCount: 5
            query: sum(ollama_gateway_all_pending_queries{tier="small"}) + 1
    medium:
        resources:
            requests:
                cpu: 3
                memory: 4Gi
            limits:
                cpu: 5
                memory: 8Gi
        replicaCount: 1
        autoscaling:
            enabled: false
            # minReplicas: 1
            # maxReplicas: 3
            # targetCPUUtilization: 60
        keda:
            enabled: true
            minReplicaCount: 1
            maxReplicaCount: 3
            query: sum(ollama_gateway_all_pending_queries{tier="medium"}) + 1
    large:
        resources:
            requests:
                cpu: 6
                memory: 12Gi
            limits:
                cpu: 8
                memory: 16Gi
        replicaCount: 1
        autoscaling:
            enabled: false
            # minReplicas: 1
            # maxReplicas: 1
            # targetCPUUtilization: 60
        keda:
            enabled: true
            minReplicaCount: 0
            maxReplicaCount: 2
            cooldownPeriod: 1000
            query: sum(ollama_gateway_all_pending_queries{tier="large"})

gpu:
    enabled: false # set to false for Apple Silicon GPUs
    # enabled: true # set to true for Nvidia and AMD GPUs
    vendor: "nvidia"
    # vendor: "amd"
    count: 1
    tolerations:
        key: "nvidia.com/gpu"
        # key: "amd.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

# Gateway router
router:
    image: ollama-router:latest
    replicaCount: 1
    resources:
        requests:
            cpu: 100m
            memory: 128Mi
        limits:
            cpu: 200m
            memory: 256Mi
    autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 5
        targetCPUUtilization: 60

keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 3
    pollingInterval: 1
    cooldownPeriod: 60 # note that KEDA creates an HPA that will add an additional 5 minutes (300 seconds)
    threshold: 1
    activationThreshold: 0
    # query: sum(ollama_gateway_all_pending_queries{tier="{{ .Values.tier }}"}) + 1

customScaler:
    enabled: true
    image: scaling-controller:latest
    idleThresholdSeconds:
        small: "5"
        medium: "5"
        large: "5"
    minReplicas:
        small: "1"
        medium: "0"
        large: "0"
    maxReplicas:
        small: "5"
        medium: "3"
        large: "2"

ollama:
    volume:
        persistentVolumeClaim:
            claimName: ollama-models

monitoring:
    prometheus:
        host: prometheus-kube-prometheus-prometheus.monitoring.svc
        port: 9090

updateStrategy: Recreate # RollingUpdate
