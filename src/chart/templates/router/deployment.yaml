{{- if eq .Values.tier "infrastructure" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-router
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama-router
spec:
    replicas: {{ .Values.router.replicaCount }}
    selector:
        matchLabels:
            app: ollama-router
    template:
        metadata:
            labels:
                app: ollama-router
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "11434"
                prometheus.io/path: "/metrics"
        spec:
            containers:
                - name: router
                  image: {{ .Values.router.image }}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 11434
                  resources:
                      requests:
                          cpu: {{ .Values.router.resources.requests.cpu }}
                          memory: {{ .Values.router.resources.requests.memory }}
                      limits:
                          cpu: {{ .Values.router.resources.limits.cpu }}
                          memory: {{ .Values.router.resources.limits.memory }}
                  envFrom:
                      - configMapRef:
                          name: ollama-router-config
                  readinessProbe:
                      httpGet:
                          path: "/api/gateway/status"
                          port: 11434
                      initialDelaySeconds: 5
                      periodSeconds: 2
                      timeoutSeconds: 2
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: "/metrics"
                          port: 11434
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 2
                      failureThreshold: 3
            tolerations:
                - key: "node-role.kubernetes.io/control-plane"
                  operator: "Equal"
                  value: ""
                  effect: "NoSchedule"
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: nvidia.com/gpu
                          operator: NotIn
                          values: ["true"]
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
{{- end }}
