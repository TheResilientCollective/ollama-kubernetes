{{- if eq .Values.tier "infrastructure" }}
{{- if .Values.router.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: ollama-router-hpa
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama
spec:
    maxReplicas: {{ .Values.router.autoscaling.maxReplicas }}
    metrics:
        - resource:
              name: cpu
              target:
                  averageUtilization: {{ .Values.router.autoscaling.targetCPUUtilization }}
                  type: Utilization
          type: Resource
    minReplicas: {{ .Values.router.autoscaling.minReplicas }}
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ollama-router
    behavior:
        scaleDown:
            stabilizationWindowSeconds: 300
{{- end }}
{{- end }}

