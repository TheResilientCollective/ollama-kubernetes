{{- if ne .Values.tier "infrastructure" }}
{{- $tierConfig := index .Values.tiers .Values.tier -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-{{ .Release.Name }}
    namespace: "{{ .Release.Namespace }}"
    labels:
        app: ollama
        tier: "{{ .Values.tier }}"
spec:
    replicas: {{ $tierConfig.replicaCount }}
    strategy:
        type: {{ .Values.updateStrategy }}
        {{- if eq .Values.updateStrategy "RollingUpdate" }}
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        {{- end }}
    selector:
        matchLabels:
            app: ollama
            tier: "{{ .Values.tier }}"
    template:
        metadata:
            labels:
                app: ollama
                tier: "{{ .Values.tier }}"
        spec:
            {{- if .Values.gpu.enabled }}
            nodeSelector:
                {{- if eq .Values.gpu.vendor "nvidia" }}
                nvidia.com/gpu: "true"
                {{- else if eq .Values.gpu.vendor "amd" }}
                amd.com/gpu: "true"
                {{- end }}
            tolerations:
                - key: "{{ .Values.gpu.tolerations.key }}"
                  operator: "{{ .Values.gpu.tolerations.operator }}"
                  effect: "{{ .Values.gpu.tolerations.effect }}"
            {{- end }}
            containers:
                - name: ollama
                  {{- if eq .Values.gpu.vendor "amd" }}
                  image: ollama/ollama:rocm
                  {{- else }}
                  image: ollama/ollama:latest
                  {{- end }}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 11434
                  env:
                      - name: OLLAMA_MODELS
                        value: /models
                      - name: SIZE_CLASS
                        value: "{{ .Values.tier }}"
                      - name: OLLAMA_KEEP_ALIVE
                        value: "5m"
                      - name: OLLAMA_HOST
                        value: "0.0.0.0"
                      # - name: TARGET_SMALL_ENDPOINT
                      #   value: http://ollama-small:11434
                      # - name: TARGET_MEDIUM_ENDPOINT
                      #   value: http://ollama-medium:11434
                      # - name: TARGET_LARGE_ENDPOINT
                      #   value: http://ollama-large:11434
                      # - name: TARGET_SMALL_SIZE
                      #   value: "3Gi"
                      # - name: TARGET_MEDIUM_SIZE
                      #   value: "4Gi"
                      # - name: TARGET_LARGE_SIZE
                      #   value: "12Gi"
                  volumeMounts:
                  {{- range $key, $val := .Values.ollama.volumeMounts }}
                      - {{ $val | toYaml | indent 24 | trim }}
                  {{- end }}
                  resources:
                      requests:
                          cpu: "{{ $tierConfig.resources.requests.cpu }}"
                          memory: "{{ $tierConfig.resources.requests.memory }}"
                          {{- if .Values.gpu.enabled }}
                          {{- if eq .Values.gpu.vendor "nvidia" }}
                          nvidia.com/gpu: "1"
                          {{- else if eq .Values.gpu.vendor "amd" }}
                          amd.com/gpu: "1"
                          {{- end }}
                          {{- end }}
                      limits:
                          cpu: "{{ $tierConfig.resources.limits.cpu }}"
                          memory: "{{ $tierConfig.resources.limits.memory }}"
                          {{- if .Values.gpu.enabled }}
                          {{- if eq .Values.gpu.vendor "nvidia" }}
                          nvidia.com/gpu: "1"
                          {{- else if eq .Values.gpu.vendor "amd" }}
                          amd.com/gpu: "1"
                          {{- end }}
                          {{- end }}
                  readinessProbe:
                      exec:
                          command:
                              - /bin/sh
                              - -c
                              - |
                                  [ "$(ollama list | wc -l)" -gt 1 ]
                      initialDelaySeconds: {{ ((.Values.ollama).readinessProbe).initialDelaySeconds | default 5 }}
                      periodSeconds: {{  ((.Values.ollama).readinessProbe).periodSeconds | default 5 }}
                      timeoutSeconds: {{  ((.Values.ollama).readinessProbe).timeoutSeconds | default 5 }}
                      failureThreshold: {{  ((.Values.ollama).readinessProbe).failureThreshold | default 10 }}
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: {{ ((.Values.ollama).livenessProbe).initialDelaySeconds | default 15 }}
                      periodSeconds: {{  ((.Values.ollama).livenessProbe).periodSeconds | default 5 }}
                      timeoutSeconds: {{  ((.Values.ollama).livenessProbe).timeoutSeconds | default 5 }}
                      failureThreshold: {{  ((.Values.ollama).livenessProbe).failureThreshold | default 5 }}
                  startupProbe:
                      httpGet:
                          path: /
                          port: 11434
                      initialDelaySeconds: {{  ((.Values.ollama).startupProbe).initialDelaySeconds | default 5 }}
                      periodSeconds: {{  ((.Values.ollama).startupProbe).periodSeconds | default 5 }}
                      timeoutSeconds: {{  ((.Values.ollama).startupProbe).timeoutSeconds | default 5 }}
                      failureThreshold: {{  ((.Values.ollama).startupProbe).failureThreshold | default 30 }}
                  lifecycle:
                      preStop:
                          exec:
                              command: ["/bin/sh/", "-c", "curl -sf http://ollama-router:11434/api/gateway/disable-pod -H 'Content-Type: application/json' -d '{\"ip\": \"$(hostname -i)\", \"tier\": \"$(SIZE_CLASS)\"}' || true"]
            volumes:
            {{- range $key, $val := .Values.ollama.volumes }}
                - {{ $val | toYaml | indent 18 | trim }}
            {{- end }}
{{- end }}
