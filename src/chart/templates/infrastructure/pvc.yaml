{{- if eq .Values.tier "infrastructure" }}
{{- if .Values.ollama.volumes.modelsVolume.persistentVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: ollama-models
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 20Gi
{{- end }}
{{- end }}
