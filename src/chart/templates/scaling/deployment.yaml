{{- if eq .Values.tier "infrastructure" }}
{{- if .Values.customScaler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama-scaling-controller
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama-scaler
spec:
    replicas: 1
    selector:
        matchLabels:
            app: ollama-scaler
    template:
        metadata:
            labels:
                app: ollama-scaler
        spec:
            serviceAccountName: ollama-scaler
            containers:
                - name: ollama-scaler
                  image: {{ .Values.customScaler.image }}
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: NAMESPACE
                        value: {{ .Release.Namespace }}
                      - name: TIERS
                        value: '{{ keys .Values.tiers | toJson }}'
                      - name: ROUTER_ENDPOINT
                        value: "http://ollama-router:11434"
                      - name: UPDATE_INTERVAL_S
                        value: "1"
                      - name: DEBUG
                        value: "true"
                      {{- range $key, $value := .Values.tiers }}
                      - name: SCALE_DOWN_IDLE_{{ $key | upper }}
                        value: "{{ index $.Values.customScaler.idleThresholdSeconds $key }}"
                      - name: MIN_REPLICAS_{{ $key | upper }}
                        value: "{{ index $.Values.customScaler.minReplicas $key }}"
                      - name: MAX_REPLICAS_{{ $key | upper }}
                        value: "{{ index $.Values.customScaler.maxReplicas $key }}"
                      {{- end }}
                      {{- if .Values.customScaler.env }}
                      {{- .Values.customScaler.env | toYaml | nindent 22 }}
                      {{- end }}
                  {{- if .Values.customScaler.envFrom }}
                  envFrom:
                      {{- .Values.customScaler.envFrom | toYaml | nindent 22 }}
                  {{- end }}
                  {{- if .Values.customScaler.volumeMounts }}
                  volumeMounts:
                      {{- .Values.customScaler.volumeMounts | toYaml | nindent 22 }}
                  {{- end }}
            {{- if .Values.customScaler.volumes }}
            {{- .Values.customScaler.volumes | toYaml | nindent 16 }}
            {{- end }}
            tolerations:
                - key: "node-role.kubernetes.io/control-plane"
                  operator: "Equal"
                  value: ""
                  effect: "NoSchedule"
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: nvidia.com/gpu
                          operator: NotIn
                          values: ["true"]
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
{{- end }}
{{- end }}
