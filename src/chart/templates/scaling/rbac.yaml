{{- if eq .Values.tier "infrastructure" }}
{{- if .Values.customScaler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: ollama-scaler
    namespace: {{ .Release.Namespace }}
    labels:
        app: ollama-scaler

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: ollama-scaler
rules:
    - apiGroups: [""]
      resources: ["pods", "nodes"]
      verbs: ["get", "list", "delete"]
    - apiGroups: ["apps"]
      resources: ["deployments/scale"]
      verbs: ["get", "patch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: ollama-scaler
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: ollama-scaler
subjects:
    - kind: ServiceAccount
      name: ollama-scaler
      namespace: {{ .Release.Namespace }}

{{- end }}
{{- end }}
