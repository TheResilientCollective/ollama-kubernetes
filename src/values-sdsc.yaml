ollama:
    volumes:
        modelsVolume:
            name: models
            hostPath:
                path: /home/ubuntu/ollama-models
                type: DirectoryOrCreate
            persistentVolumeClaim: null
    readinessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 15
        failureThreshold: 10
    # livenessProbe:
    #     initialDelaySeconds: 15
    #     periodSeconds: 10
    #     timeoutSeconds: 10
    #     failureThreshold: 5
    # startupProbe:
    #     initialDelaySeconds: 20
    #     periodSeconds: 10
    #     timeoutSeconds: 10
    #     failureThreshold: 30

pullmodels:
    volumes:
        modelsVolume:
            name: models
            emptyDir: {}
            persistentVolumeClaim: null
            hostPath: null
        s3mount:
            name: s3-mount
            hostPath:
                path: /home/ubuntu/ollama-models
                type: DirectoryOrCreate
    volumeMounts:
        modelsVolumeMount:
            name: models
            mountPath: /models
        s3mount:
            name: s3-mount
            mountPath: /s3
    commandAdditions: echo "Installing rsync"; apt update; apt install rsync -y; echo "Copying models to shared S3 mount"; rsync -av --copy-links --no-perms --no-owner --no-group --inplace /models/ /s3/; echo "Copying complete"
